<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ProPokeDez</title>
        <link rel="stylesheet" href="./ProPokeDez.css">
    </head>

    <body>

        <h1 id="titulo_Pagina">ProPokeDeZ</h1>

        <div id="Container_Of_Cards">

            <div class="Cards" id="Bulbasaur_Card">
                <h3 id="pokedex-0001" class="podedex_Pokemon">#0001</h3>
                <img id="imagen-0001" class="imagen_Pokemon" src="./Images/Pokemon-Bulbasaur-PNG-File.png" alt="Bulbasaur">
                <h2 id="nombre-0001" class="nombre_Pokemon">Bulbasaur</h2>
            </div>

            <div class="Cards" id="Ivysaur_Card">
                <h3 id="pokedex-0002" class="podedex_Pokemon">#0002</h3>
                <img id="imagen-0002" class="imagen_Pokemon" src="./Images/Ivysaur-Pokemon-PNG-HD.png" alt="Ivysaur">
                <h2 id="nombre-0002" class="nombre_Pokemon">Ivysaur</h2>
            </div>

            <div class="Cards" id="Venusaur_Card">
                <h3 id="pokedex-0003" class="podedex_Pokemon">#0003</h3>
                <img id="imagen-0003" class="imagen_Pokemon" src="./Images/Venusaur-Pokemon-PNG.png" alt="Venusaur">
                <h2 id="imagen-0003" class="nombre_Pokemon">Venusaur</h2>
            </div>

            <div class="Cards" id="Charmander_Card">
                <h3 id="pokedex-0004" class="podedex_Pokemon">#0004</h3>
                <img id="imagen-0004" class="imagen_Pokemon" src="./Images/Charmander-PNG-Photos.png" alt="Charmander">
                <h2 id="imagen-0004" class="nombre_Pokemon">Charmander</h2>
            </div>

        </div>

        <script src="./ProPokeDez.js"></script>        

    </body>
</html>
